# Supabase CLI config — only needed if you deploy Edge Functions via CLI.
# `auth-login` must be public (callers are not authenticated yet); the
# function does its own rate limiting. `invite-user` requires a valid JWT.

project_id = "vegs-system"

[functions.auth-login]
verify_jwt = false

[functions.invite-user]
verify_jwt = true

# Called by pg_net database triggers (not by users) — auth is a shared
# secret header (PUSH_WEBHOOK_SECRET), so JWT verification stays off.
[functions.send-push]
verify_jwt = false
