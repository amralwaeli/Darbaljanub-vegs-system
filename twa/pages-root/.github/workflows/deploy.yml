# ============================================================================
# Publishes this repo's static files to GitHub Pages via Actions.
#
# For the `amralwaeli.github.io` user-site repo, whose only job is to serve
# /.well-known/assetlinks.json at the DOMAIN ROOT so Android can verify the
# TWA and drop the address bar.
#
# One-time: Settings -> Pages -> Source: "GitHub Actions".
#
# There is no build step — the repo IS the site. The whole directory is
# uploaded as-is, which is what keeps the dot-folder intact: the artifact
# upload does not run Jekyll, so `.well-known/` survives. `.nojekyll` is kept
# anyway so the repo still works if the source is ever switched to a branch.
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
